@if (project) {
    <button class="noteGroupButton" (click)="displayNoteGroupForm()">Create a note group</button>
    <div class="grouplist" >
    @for (notegroup of project.noteGroups; track $index) {
        <div class="notegroup">
            <h2>{{ notegroup.name }}</h2>

        @for (note of notegroup.notes; track note.id) {
            <p>{{ note.text }}</p>
        }
        </div>
    }
    </div>
}
