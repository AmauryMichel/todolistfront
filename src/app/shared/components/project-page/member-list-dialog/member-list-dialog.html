<div class="formParent">
    <h2>Member List</h2>
    <div>
        <ul>
            @for (user of data.project.projectMembers; track user.id) {
            <li>
                {{ user.username }}
                <button (click)="removeMember(user)">X</button>
            </li>
            }
        </ul>
    </div>
</div>
