<header>
    <div class="headerRight">
        <a routerLink="/">Home</a>
        @if (isLoggedIn) {
            <a routerLink="/projects">My Projects</a>
        } 
    </div>

    <div class="headerLeft">
        @if (isLoggedIn) {
            <a routerLink="/">Profile</a>
            <a routerLink="/" (click)="logOut()">Log out</a>
        } @else {
            <a routerLink="/register">Register</a>
            <a routerLink="/login">Login</a>
        }
    </div> 
</header>
