<div class="formParent">
  <h2>Login</h2> 
  <form class="formClass" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
      <input class="formInput" id="username" type="text" formControlName="username" placeholder="Username" />

      <input class="formInput" id="password" type="password" formControlName="password" placeholder="Password" />
    
    <button class="submitButton" type="submit" [disabled]="!loginForm.valid">Submit</button>
  </form>
</div>
